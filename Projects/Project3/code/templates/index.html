<!DOCTYPE html>
<html>
<head>
    <title>MBTA Stop Finder</title>
</head>
<body>
    <h1>Find the Nearest MBTA Stop</h1>

    <form action="/result" method="POST">
        <label for="place">Enter a place or address:</label>
        <input type="text" id="place" name="place" placeholder="Boston Common">
        <button type="submit">Find Stop</button>
    </form>

    {% if error %}
        <p style="color: red;">{{ error }}</p>
    {% endif %}
</body>
</html>
